name: carzigo_partner
description: "Carzigo Partner mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  country_picker: ^2.0.28
  dotted_border: ^3.1.0
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  image_picker: ^1.1.2
  pin_code_fields: ^9.4.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  image_cropper: ^12.2.1
  url_launcher: ^6.3.2
  fluttertoast: ^10.0.0
  flutter_html: ^3.0.0
  http: ^1.5.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_crashlytics: ^5.3.0
  flutter_local_notifications: ^22.3.0

# flutter_html 3.0.0 still calls html's internal qs.matches(),
# which was removed in html 0.15.7.
dependency_overrides:
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/webp/
    - assets/images/icons/
    - assets/translations/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/satoshi/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/satoshi/Satoshi-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/satoshi/Satoshi-Black.otf
          weight: 900
